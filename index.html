<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aureon</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <img class="logo" src="img/aureon-logo.png?v=2" alt="Aureon">
        <div>
          <h1>Aureon</h1>
          <p class="tag" data-i18n="tag">Identity console</p>
        </div>
      </div>
      <p id="boot">Loading…</p>
    </header>

    <section class="card connect">
      <label class="port">
        <span data-i18n="port">Port</span>
        <select id="portList"></select>
      </label>
      <button id="addPort" type="button" data-i18n="addPort">Add port</button>
      <button id="open" type="button" data-i18n="open">Open</button>
      <button id="close" type="button" data-i18n="close" disabled>Close</button>
      <select id="lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="cn">中文</option>
        <option value="kr">한국어</option>
        <option value="jp">日本語</option>
      </select>
      <p id="status">Add a port, then open it.</p>
    </section>

    <section class="card features">
      <div class="feat-grid">
        <label class="feat"><input type="radio" name="cmd" value="enrollFace"><img src="img/feat-enroll-face.png?v=2" alt=""><span data-i18n="enrollFace">Enroll face</span></label>
        <label class="feat"><input type="radio" name="cmd" value="identifyFace"><img src="img/feat-identify-face.png?v=2" alt=""><span data-i18n="identifyFace">Identify face</span></label>
        <label class="feat"><input type="radio" name="cmd" value="deleteFace"><img src="img/feat-delete-face.png?v=2" alt=""><span data-i18n="deleteFace">Delete face</span></label>
        <label class="feat"><input type="radio" name="cmd" value="clearFace"><img src="img/feat-clear-faces.png?v=2" alt=""><span data-i18n="clearFace">Delete all faces</span></label>
        <label class="feat"><input type="radio" name="cmd" value="download"><img src="img/feat-enroll-image.png?v=2" alt=""><span data-i18n="download">Enroll from image</span></label>
        <label class="feat"><input type="radio" name="cmd" value="enrollPv"><img src="img/feat-enroll-palm.png?v=2" alt=""><span data-i18n="enrollPv">Enroll palm</span></label>
        <label class="feat"><input type="radio" name="cmd" value="deletePv"><img src="img/feat-delete-palm.png?v=2" alt=""><span data-i18n="deletePv">Delete palm</span></label>
        <label class="feat"><input type="radio" name="cmd" value="clearPv"><img src="img/feat-clear-palms.png?v=2" alt=""><span data-i18n="clearPv">Delete all palms</span></label>
        <label class="feat"><input type="radio" name="cmd" value="getAll"><img src="img/feat-ids.png?v=2" alt=""><span data-i18n="getAll">Enrolled IDs</span></label>
        <label class="feat"><input type="radio" name="cmd" value="version"><img src="img/feat-version.png?v=2" alt=""><span data-i18n="version">Version</span></label>
      </div>
    </section>

    <section class="desk">
      <div class="col">
        <div class="card actions">
          <button id="send" type="button" data-i18n="send" disabled>Send</button>
          <button id="stop" type="button" data-i18n="stop" disabled>Stop</button>
          <div id="imageRow" class="pick" hidden>
            <button id="pickImage" type="button" data-i18n="chooseImage">Choose image</button>
            <span id="imageName">No image selected</span>
            <input id="imageFile" type="file" accept=".jpg,.jpeg,image/jpeg" hidden>
          </div>
        </div>

        <article class="card log trace">
          <div class="log-head"><span data-i18n="trace">Trace</span></div>
          <textarea id="cmdLog" readonly aria-label="Command bytes"></textarea>
          <textarea id="resultLog" readonly></textarea>
        </article>

        <div class="card stage">
          <div class="log-head"><span data-i18n="display">Display</span></div>
          <div class="frame"><canvas id="view" width="240" height="320"></canvas></div>
        </div>
      </div>

      <article class="card log activity">
        <div class="log-head">
          <span data-i18n="activity">Activity</span>
          <button id="clearLogs" type="button" data-i18n="clear">Clear</button>
        </div>
        <textarea id="paramLog" readonly></textarea>
      </article>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
